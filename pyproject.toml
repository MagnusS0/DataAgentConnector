[project]
name = "data-agent-connector"
version = "0.1.0"
description = "A connector for Data Agents to interface with various databases through MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lancedb>=0.40.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyodbc>=5.3.0",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.5",
    "async-lru>=2.4.0",
    "fastmcp>=4.1.2",
    "fastapi[standard]>=0.156.2",
    "cachetools>=7.2.4",
]

[dependency-groups]
ai = [
    "pydantic-ai-slim[openai,mcp]>=2.58.0",
    "sentence-transformers>=6.1.0",
]
dev = [
    "prek>=0.5.6",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.ruff.lint]
# Keep the pre-0.16 default rule set; ruff's expanded defaults are a separate cleanup.
select = ["E4", "E7", "E9", "F"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.dac.settings]
databases_file = "databases.toml"

log_level = "INFO"
log_folder = "logs"

mcp_query_limit = 25

annotate_on_startup = true
max_concurrent_annotations = 32

lance_db_path = "./data/lance_db"
n_dims = 768
embedding_model_name = "google/embeddinggemma-300m"
device = "cuda"

allowed_sql_commands = ["SELECT", "SHOW", "DESCRIBE", "DESC", "EXPLAIN", "WITH", "PRAGMA"]

[tool.dac.settings.fts_extraction_options]
max_workers = 8
max_values_per_column = 10000
min_length = 1
max_length = 120
