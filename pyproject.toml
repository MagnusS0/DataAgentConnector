[project]
name = "data-agent-connector"
version = "0.1.0"
description = "A connector for Data Agents to interface with various databases through MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lancedb>=0.40.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyodbc>=5.3.0",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.5",
    "async-lru>=2.4.0",
    "fastmcp>=4.1.2",
    "fastapi[standard]>=0.156.2",
    "cachetools>=7.2.4",
]

[dependency-groups]
ai = [
    "pydantic-ai-slim[openai,mcp]>=2.58.0",
]
dev = [
    "prek>=0.5.6",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.uv]
# GHSA-hq85-5cpj-mr62: earlier uv releases trust a compromised emSign root CA.
required-version = ">=0.13.4"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.dac.settings]
databases_file = "databases.toml"

log_level = "INFO"
log_folder = "logs"

mcp_query_limit = 25

annotate_on_startup = true
max_concurrent_annotations = 32

lance_db_path = "./data/lance_db"

allowed_sql_commands = ["SELECT", "SHOW", "DESCRIBE", "DESC", "EXPLAIN", "WITH", "PRAGMA"]

[tool.dac.settings.fts_extraction_options]
max_workers = 8
max_values_per_column = 10000
min_length = 1
max_length = 120
